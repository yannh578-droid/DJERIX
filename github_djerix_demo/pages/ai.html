<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJERIX — IA</title><link rel="stylesheet" href="../css/style.css"></head><body>
<header class="topbar"><a class="brand" href="../index.html"><img class="brand-dx" src="../assets/dx-mark.png" alt="DX"><span><b>DJERIX</b><small>TECHNOLOGIES</small></span></a><nav class="nav"><a href="../index.html">Accueil</a><a class="active" href="ai.html">IA</a><a href="write.html">Rédaction</a><a href="translate.html">Traduction</a><a href="tools.html">Outils</a></nav><div class="lang-switch" id="langSwitch"><button class="active" data-lang="fr">FR</button><button data-lang="en">EN</button></div><button class="menu-btn" id="menuBtn">☰</button><div class="mobile-menu" id="mobileMenu"><a href="../index.html">Accueil</a><a href="ai.html">IA</a><a href="write.html">Rédaction</a><a href="translate.html">Traduction</a><a href="tools.html">Outils</a></div></header>
<main class="chat-layout"><div class="container"><div class="chat-head"><div><span class="eyebrow">INTELLIGENCE DJERIX</span><h1>Parlez à DJERIX.</h1><p>Posez une question, demandez une explication ou développez une idée.</p></div><button class="btn btn-outline" id="newChat">＋ Nouvelle conversation</button></div>
<section class="chat-card"><div class="messages" id="messages"><div class="welcome" id="welcome"><div class="welcome-mark"><img src="../assets/dx-mark.png" alt="DX"></div><h2>Bonjour, je suis DJERIX.</h2><p>Commencez une conversation ou choisissez une suggestion.</p><div class="suggestions"><button class="suggestion">Explique-moi l’intelligence artificielle</button><button class="suggestion">Donne-moi une idée de projet</button><button class="suggestion">Aide-moi à apprendre Python</button><button class="suggestion">Améliore ce texte</button></div></div></div><div class="composer"><div class="composer-row"><textarea id="prompt" placeholder="Écrivez votre message à DJERIX..."></textarea><button class="btn btn-primary send" id="send" aria-label="Envoyer">➤</button></div></div></section></div></main>
<script src="../js/app.js"></script><script src="../js/djerix-api.js"></script><script>
const messages=document.getElementById('messages'),promptBox=document.getElementById('prompt'),sendBtn=document.getElementById('send'),welcome=document.getElementById('welcome'),history=[];
const params=new URLSearchParams(location.search);
const mode=params.get('mode');
const initialPrompt=params.get('prompt');
const modeLabels={study:'Assistant d’études',presentation:'Création de présentations',document:'Analyse de documents',image:'Création visuelle',website:'Création de sites web',ideas:'Laboratoire d’idées',planner:'Planificateur intelligent',research:'Recherche assistée',productivity:'Productivité',career:'Carrière',translation:'Traduction avancée',business:'Assistant business'};
if(mode && modeLabels[mode]) document.title='DJERIX — '+modeLabels[mode];
if(initialPrompt){ promptBox.value=initialPrompt; setTimeout(()=>promptBox.focus(),80); }
function addMessage(text,who='assistant'){welcome?.remove();const row=document.createElement('div');row.className='message '+(who==='user'?'user':'');row.innerHTML='<div class="avatar">'+(who==='user'?'VO':'DX')+'</div><div class="bubble"></div>';row.querySelector('.bubble').textContent=text;messages.appendChild(row);messages.scrollTop=messages.scrollHeight}
function typing(){welcome?.remove();const row=document.createElement('div');row.className='message';row.id='typing';row.innerHTML='<div class="avatar">DX</div><div class="bubble">DJERIX réfléchit…</div>';messages.appendChild(row);messages.scrollTop=messages.scrollHeight}
async function send(){const text=promptBox.value.trim();if(!text||sendBtn.disabled)return;addMessage(text,'user');history.push({role:'user',content:text});promptBox.value='';sendBtn.disabled=true;typing();try{const d=await DJERIX_API.request('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,language:document.documentElement.lang})});document.getElementById('typing')?.remove();history.push({role:'assistant',content:d.reply});addMessage(d.reply)}catch(e){document.getElementById('typing')?.remove();addMessage('Le serveur DJERIX n’est pas connecté. Lance le serveur dans le dossier server avec « npm install » puis « npm start », et garde cette page ouverte.');console.error(e)}finally{sendBtn.disabled=false;promptBox.focus()}}
function bindSuggestions(){document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{promptBox.value=b.textContent;send()})}
sendBtn.onclick=send;promptBox.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};bindSuggestions();document.getElementById('newChat').onclick=()=>{messages.innerHTML='<div class="welcome" id="welcome"><div class="welcome-mark"><img src="../assets/dx-mark.png" alt="DX"></div><h2>Bonjour, je suis DJERIX.</h2><p>Commencez une conversation ou choisissez une suggestion.</p><div class="suggestions"><button class="suggestion">Explique-moi l’intelligence artificielle</button><button class="suggestion">Donne-moi une idée de projet</button><button class="suggestion">Aide-moi à apprendre Python</button><button class="suggestion">Améliore ce texte</button></div></div>';history.length=0;bindSuggestions();promptBox.value='';promptBox.focus()};
</script></body></html>
