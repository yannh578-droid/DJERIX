<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJERIX — Traduction</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="topbar"><a class="brand" href="../index.html"><img class="brand-dx" src="../assets/dx-mark.png" alt="DX"><span><b>DJERIX</b><small>TECHNOLOGIES</small></span></a><nav class="nav"><a href="../index.html">Accueil</a><a href="service.html">Services</a><a href="write.html">Rédaction</a><a class="active" href="translate.html">Traduction</a><a href="tools.html">Outils</a></nav><div class="lang-switch" id="langSwitch"><button data-lang="fr">FR</button><button data-lang="en">EN</button></div><button class="menu-btn" id="menuBtn">☰</button><div class="mobile-menu" id="mobileMenu"><a href="../index.html">Accueil</a><a href="service.html">Services</a><a href="write.html">Rédaction</a><a href="translate.html">Traduction</a><a href="tools.html">Outils</a></div></header><main class="page-shell"><div class="container page-wrap"><span class="eyebrow">DJERIX · TRADUCTION</span><h1 class="page-title">Traduisez avec contexte.</h1><p class="page-sub">Choisissez votre langue cible et adaptez le ton de votre traduction.</p><div class="tool-card" style="margin-top:24px"><select id="lang"><option value="en">Anglais / English</option><option value="fr">Français / French</option></select><textarea id="text" placeholder="Texte à traduire..."></textarea><button class="btn btn-primary" onclick="translateText()" style="margin-top:14px">Traduire →</button><div class="result" id="out">La traduction apparaîtra ici.</div></div></div></main><script src="../js/app.js"></script><script src="../js/djerix-api.js"></script><script>
async function translateText(){const text=document.getElementById('text').value.trim(),lang=document.getElementById('lang').value,out=document.getElementById('out');if(!text){document.getElementById('text').focus();return}out.textContent='DJERIX réfléchit…';try{const d=await DJERIX_API.request('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,target:lang})});out.textContent=d.reply}catch(e){out.textContent='Serveur DJERIX non connecté. Lance le serveur dans server puis réessaie.';console.error(e)}}
</script></script></body></html>
