<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJERIX — Rédaction</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="topbar"><a class="brand" href="../index.html"><img class="brand-dx" src="../assets/dx-mark.png" alt="DX"><span><b>DJERIX</b><small>TECHNOLOGIES</small></span></a><nav class="nav"><a href="../index.html">Accueil</a><a href="service.html">Services</a><a class="active" href="write.html">Rédaction</a><a href="translate.html">Traduction</a><a href="tools.html">Outils</a></nav><div class="lang-switch" id="langSwitch"><button data-lang="fr">FR</button><button data-lang="en">EN</button></div><button class="menu-btn" id="menuBtn">☰</button><div class="mobile-menu" id="mobileMenu"><a href="../index.html">Accueil</a><a href="service.html">Services</a><a href="write.html">Rédaction</a><a href="translate.html">Traduction</a><a href="tools.html">Outils</a></div></header><main class="page-shell"><div class="container page-wrap"><span class="eyebrow">DJERIX · RÉDACTION</span><h1 class="page-title">Écrivez mieux.</h1><p class="page-sub">Améliorez, résumez ou corrigez vos textes avec une interface claire et rapide.</p><div class="form-card" style="margin-top:24px"><div class="form-grid"><textarea id="source" placeholder="Écrivez ou collez votre texte..."></textarea><textarea id="result" placeholder="Le résultat apparaîtra ici..." readonly></textarea></div><div class="actions"><button class="btn btn-primary" onclick="rewrite('improve')">Améliorer</button><button class="btn" onclick="rewrite('summarize')">Résumer</button><button class="btn" onclick="rewrite('correct')">Corriger</button></div></div></div></main><script src="../js/app.js"></script><script src="../js/djerix-api.js"></script><script>
async function rewrite(action){const source=document.getElementById('source'),result=document.getElementById('result'),text=source.value.trim();if(!text){source.focus();return}result.value='DJERIX réfléchit…';try{const d=await DJERIX_API.request('/api/writing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,action,language:document.documentElement.lang==='en'?'en':'fr'})});result.value=d.reply}catch(e){result.value='Serveur DJERIX non connecté. Lance le serveur dans server puis réessaie.';console.error(e)}}
</script></script></body></html>
