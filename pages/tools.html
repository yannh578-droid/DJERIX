<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJERIX — Outils</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="topbar"><a class="brand" href="../index.html"><img class="brand-dx" src="../assets/dx-mark.png" alt="DX"><span><b>DJERIX</b><small>TECHNOLOGIES</small></span></a><nav class="nav"><a href="../index.html">Accueil</a><a href="service.html">Services</a><a href="write.html">Rédaction</a><a href="translate.html">Traduction</a><a class="active" href="tools.html">Outils</a></nav><div class="lang-switch" id="langSwitch"><button data-lang="fr">FR</button><button data-lang="en">EN</button></div><button class="menu-btn" id="menuBtn">☰</button><div class="mobile-menu" id="mobileMenu"><a href="../index.html">Accueil</a><a href="service.html">Services</a><a href="write.html">Rédaction</a><a href="translate.html">Traduction</a><a href="tools.html">Outils</a></div></header><main class="page-shell"><div class="container page-wrap"><span class="eyebrow">DJERIX · PRODUCTIVITÉ</span><h1 class="page-title">Les outils essentiels.</h1><p class="page-sub">Des petits outils rapides pour vos calculs et conversions quotidiennes.</p><div class="tool-grid"><div class="tool-card"><h3>Calculatrice</h3><input id="calc" placeholder="Ex. 125*4+30"><button class="btn btn-primary" onclick="calcNow()">Calculer</button><div class="result" id="calcOut">—</div></div><div class="tool-card"><h3>Pourcentage</h3><input id="pctA" type="number" placeholder="Valeur"><input id="pctB" type="number" placeholder="%"><button class="btn btn-primary" onclick="pct()">Calculer</button><div class="result" id="pctOut">—</div></div><div class="tool-card"><h3>Moyenne</h3><input id="avg" placeholder="12, 15, 17, 10"><button class="btn btn-primary" onclick="average()">Calculer</button><div class="result" id="avgOut">—</div></div><div class="tool-card"><h3>Km → Miles</h3><input id="km" type="number" placeholder="Kilomètres"><button class="btn btn-primary" onclick="kmMiles()">Convertir</button><div class="result" id="kmOut">—</div></div><div class="tool-card"><h3>Miles → Km</h3><input id="mi" type="number" placeholder="Miles"><button class="btn btn-primary" onclick="milesKm()">Convertir</button><div class="result" id="miOut">—</div></div></div></div></main><script src="../js/app.js"></script><script src="../js/djerix-api.js"></script><script>function calcNow(){try{document.getElementById('calcOut').textContent=Function('"use strict";return ('+document.getElementById('calc').value+')')()}catch(e){document.getElementById('calcOut').textContent='Expression invalide'}}function pct(){let a=+pctA.value,b=+pctB.value;pctOut.textContent=isFinite(a*b/100)?a*b/100:'—'}function average(){let v=avg.value.split(',').map(Number).filter(Number.isFinite);avgOut.textContent=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2):'—'}function kmMiles(){kmOut.textContent=(+km.value*0.621371).toFixed(3)+' miles'}function milesKm(){miOut.textContent=(+mi.value*1.609344).toFixed(3)+' km'}</script></body></html>
